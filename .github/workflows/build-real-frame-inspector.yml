name: Build Real Frame Inspector (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Fetch upstream Frame Inspector
        uses: actions/checkout@v4
        with:
          repository: lightningstudiosx/frame_inspector
          ref: main
          path: frame-inspector-upstream
          persist-credentials: false

      - name: Build upstream Frame Inspector
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: frame-inspector-upstream
          target: Win64
          sdk: latest
          build-config: Release

      - name: Upload upstream Geode package
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Inspector-Windows-Upstream
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
