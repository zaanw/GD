name: Build Frame Window Scanner (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-real-frame-inspector.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout upstream Frame Inspector
        uses: actions/checkout@v4
        with:
          repository: lightningstudiosx/frame_inspector
          ref: main
          path: frame-inspector-upstream
          persist-credentials: false

      - name: Build frame window scanner
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: frame-inspector-upstream
          target: Win64
          sdk: latest
          build-config: Release

      - name: Confirm packaged mod exists
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.build.outputs.build-output }}
        run: |
          Write-Host "Build output: $env:PACKAGE_PATH"
          $files = @(Get-ChildItem -Path "$env:PACKAGE_PATH" -Filter *.geode -Recurse -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "No .geode package was produced" }
          $files | ForEach-Object { Write-Host "Package: $($_.FullName)" }

      - name: Upload Windows mod
        uses: actions/upload-artifact@v4
        with:
          name: Frame-Inspector-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
