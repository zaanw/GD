name: Build GD Nova (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          sdk: latest
          build-config: Release
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: GD-Nova-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
